<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FDF6F0"/>
      <stop offset="100%" style="stop-color:#F5EDE6"/>
    </linearGradient>
    <linearGradient id="coral-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E85D4A"/>
      <stop offset="100%" style="stop-color:#F07268"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="1100" cy="80" r="120" fill="#E85D4A" opacity="0.08"/>
  <circle cx="100" cy="550" r="80" fill="#E85D4A" opacity="0.06"/>

  <!-- Left side: Text content -->
  <text x="80" y="200" font-family="system-ui, sans-serif" font-size="56" font-weight="700" fill="#1a1a2e">
    Context<tspan fill="#E85D4A">Money</tspan>
  </text>
  <text x="80" y="260" font-family="system-ui, sans-serif" font-size="28" fill="#6b7280">
    Track Expenses Across Life Phases
  </text>
  <text x="80" y="320" font-family="system-ui, sans-serif" font-size="20" fill="#9ca3af">
    No signup · No servers · 100% private · Works offline
  </text>

  <!-- Feature pills -->
  <rect x="80" y="370" width="160" height="44" rx="22" fill="#E85D4A" opacity="0.1"/>
  <text x="115" y="398" font-family="system-ui, sans-serif" font-size="16" fill="#E85D4A" font-weight="600">📊 Analytics</text>

  <rect x="260" y="370" width="140" height="44" rx="22" fill="#E85D4A" opacity="0.1"/>
  <text x="290" y="398" font-family="system-ui, sans-serif" font-size="16" fill="#E85D4A" font-weight="600">💰 Budget</text>

  <rect x="420" y="370" width="170" height="44" rx="22" fill="#E85D4A" opacity="0.1"/>
  <text x="450" y="398" font-family="system-ui, sans-serif" font-size="16" fill="#E85D4A" font-weight="600">🔄 Multi-Context</text>

  <!-- Right side: Mock dashboard card -->
  <rect x="680" y="100" width="440" height="430" rx="24" fill="white" filter="drop-shadow(0 4px 20px rgba(0,0,0,0.08))"/>

  <!-- Dashboard header -->
  <text x="720" y="150" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#1a1a2e">May 2026</text>
  <text x="720" y="175" font-family="system-ui, sans-serif" font-size="14" fill="#9ca3af">Monthly Overview</text>

  <!-- Spent amount -->
  <text x="720" y="225" font-family="system-ui, sans-serif" font-size="36" font-weight="700" fill="#1a1a2e">₹32,500</text>
  <text x="720" y="250" font-family="system-ui, sans-serif" font-size="14" fill="#9ca3af">of ₹50,000 budget</text>

  <!-- Budget bar -->
  <rect x="720" y="270" width="360" height="12" rx="6" fill="#f3f4f6"/>
  <rect x="720" y="270" width="234" height="12" rx="6" fill="url(#coral-grad)"/>

  <!-- Category items -->
  <text x="720" y="320" font-family="system-ui, sans-serif" font-size="16" fill="#1a1a2e">🍕 Food</text>
  <text x="1040" y="320" font-family="system-ui, sans-serif" font-size="16" fill="#1a1a2e" text-anchor="end">₹8,500</text>

  <text x="720" y="355" font-family="system-ui, sans-serif" font-size="16" fill="#1a1a2e">🏠 Rent</text>
  <text x="1040" y="355" font-family="system-ui, sans-serif" font-size="16" fill="#1a1a2e" text-anchor="end">₹15,000</text>

  <text x="720" y="390" font-family="system-ui, sans-serif" font-size="16" fill="#1a1a2e">🚗 Transport</text>
  <text x="1040" y="390" font-family="system-ui, sans-serif" font-size="16" fill="#1a1a2e" text-anchor="end">₹3,200</text>

  <text x="720" y="425" font-family="system-ui, sans-serif" font-size="16" fill="#1a1a2e">🎬 Entertainment</text>
  <text x="1040" y="425" font-family="system-ui, sans-serif" font-size="16" fill="#1a1a2e" text-anchor="end">₹2,800</text>

  <text x="720" y="460" font-family="system-ui, sans-serif" font-size="16" fill="#1a1a2e">💰 Savings</text>
  <text x="1040" y="460" font-family="system-ui, sans-serif" font-size="16" fill="#1a1a2e" text-anchor="end">₹3,000</text>

  <!-- Insight card -->
  <rect x="720" y="480" width="360" height="36" rx="8" fill="#FEF3C7"/>
  <text x="735" y="504" font-family="system-ui, sans-serif" font-size="13" fill="#92400E">💡 Weekend spend 2.1x weekday avg</text>

  <!-- PWA badge bottom-left -->
  <rect x="80" y="460" width="100" height="32" rx="8" fill="#1a1a2e"/>
  <text x="96" y="481" font-family="system-ui, sans-serif" font-size="13" fill="white" font-weight="600">PWA ✓</text>

  <rect x="196" y="460" width="130" height="32" rx="8" fill="#1a1a2e"/>
  <text x="212" y="481" font-family="system-ui, sans-serif" font-size="13" fill="white" font-weight="600">Offline-first</text>

  <rect x="342" y="460" width="100" height="32" rx="8" fill="#1a1a2e"/>
  <text x="358" y="481" font-family="system-ui, sans-serif" font-size="13" fill="white" font-weight="600">Free ✓</text>
</svg>
